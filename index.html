<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: hidden !important; }
        .completed-item { opacity: 0.6; filter: grayscale(100%); }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <!-- Header & Dashboard -->
    <div class="max-w-4xl mx-auto p-4 md:p-6 mt-4 md:mt-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-indigo-600">🎯 All-in-One Tracker</h1>
                <p class="text-gray-500 mt-1">จัดการ Bucket List และ To-Do List ในที่เดียว</p>
            </div>
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition transform hover:scale-105 w-full md:w-auto">
                + เพิ่มรายการใหม่
            </button>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-4 text-center border-b-4 border-indigo-400">
                <p class="text-xs md:text-sm text-gray-500 font-semibold">เป้าหมายทั้งหมด</p>
                <p class="text-2xl md:text-3xl font-bold text-gray-800" id="statTotal">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 text-center border-b-4 border-green-400">
                <p class="text-xs md:text-sm text-gray-500 font-semibold">งบที่ต้องใช้ (฿)</p>
                <p class="text-xl md:text-2xl font-bold text-green-600" id="statBudget">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 text-center border-b-4 border-yellow-400">
                <p class="text-xs md:text-sm text-gray-500 font-semibold">สำเร็จแล้ว</p>
                <p class="text-2xl md:text-3xl font-bold text-yellow-600" id="statCompleted">0</p>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-4">
            <div class="flex-1">
                <label class="block text-xs font-medium text-gray-500 mb-1">หมวดหมู่</label>
                <select id="filterType" onchange="renderItems()" class="w-full rounded-md border-gray-300 shadow-sm border p-2 text-sm focus:border-indigo-500">
                    <option value="all">แสดงทั้งหมด</option>
                    <option value="bucket">🌟 เฉพาะ Bucket List</option>
                    <option value="todo">✅ เฉพาะ To-Do List</option>
                </select>
            </div>
            <div class="flex-1">
                <label class="block text-xs font-medium text-gray-500 mb-1">สถานะ</label>
                <select id="filterStatus" onchange="renderItems()" class="w-full rounded-md border-gray-300 shadow-sm border p-2 text-sm focus:border-indigo-500">
                    <option value="all">แสดงทั้งหมด</option>
                    <option value="pending" selected>⏳ รอทำ (ยังไม่สำเร็จ)</option>
                    <option value="completed">✅ สำเร็จแล้ว</option>
                </select>
            </div>
        </div>

        <!-- พื้นที่แสดงข้อมูล -->
        <div id="bucketListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full text-center py-10 text-gray-400" id="loadingText">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <!-- 🛠 Modal สำหรับเพิ่ม/แก้ไขข้อมูล -->
    <div class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50 px-4" id="mainModal">
        <div class="modal-overlay absolute w-full h-full bg-black opacity-50" onclick="toggleModal('mainModal')"></div>
        <div class="modal-container bg-white w-full max-w-md mx-auto rounded-xl shadow-2xl z-50 overflow-y-auto max-h-[90vh]">
            <div class="modal-content py-4 px-6 text-left">
                <div class="flex justify-between items-center pb-3 border-b">
                    <p class="text-xl font-bold text-gray-800" id="modalTitle">✨ เพิ่มรายการใหม่</p>
                    <div class="modal-close cursor-pointer z-50" onclick="toggleModal('mainModal')">
                        <span class="text-2xl text-gray-400 hover:text-red-500">&times;</span>
                    </div>
                </div>
                
                <form id="bucketForm" class="space-y-3 mt-4">
                    <input type="hidden" id="editId" value="">

                    <!-- 🛑 ตัวเลือกประเภท (ใหม่) -->
                    <div class="bg-indigo-50 p-2 rounded-lg border border-indigo-100 flex gap-2">
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="itemType" value="bucket" class="peer hidden" checked>
                            <div class="peer-checked:bg-indigo-600 peer-checked:text-white bg-white text-gray-600 py-2 rounded-md font-medium text-sm transition shadow-sm">
                                🌟 Bucket List
                            </div>
                        </label>
                        <label class="flex-1 text-center cursor-pointer">
                            <input type="radio" name="itemType" value="todo" class="peer hidden">
                            <div class="peer-checked:bg-indigo-600 peer-checked:text-white bg-white text-gray-600 py-2 rounded-md font-medium text-sm transition shadow-sm">
                                ✅ To-Do List
                            </div>
                        </label>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">1. สิ่งที่อยากทำ / งานที่ต้องทำ</label>
                        <input type="text" id="itemName" required class="mt-1 block w-full rounded-md border p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">2. งบประมาณที่ใช้ (บาท)</label>
                        <input type="number" id="itemPrice" required min="0" class="mt-1 block w-full rounded-md border p-2 text-sm" placeholder="0 = ฟรี">
                    </div>
                    
                    <div class="flex gap-2">
                        <div class="w-1/2">
                            <label class="block text-sm font-medium text-gray-700">3. ความจำเป็น</label>
                            <select id="itemNecessity" class="mt-1 block w-full rounded-md border p-2 text-sm">
                                <option value="3">🔥 ต้องทำให้ได้</option>
                                <option value="2">⭐ ควรทำ</option>
                                <option value="1">☁️ แค่ความอยาก</option>
                            </select>
                        </div>
                        <div class="w-1/2">
                            <label class="block text-sm font-medium text-gray-700">4. ผลกระทบ</label>
                            <select id="itemImpact" class="mt-1 block w-full rounded-md border p-2 text-sm">
                                <option value="3">😭 กระทบหนัก</option>
                                <option value="2">🥲 ปานกลาง</option>
                                <option value="1">😌 ไม่เป็นไร</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- โซน Bucket List (ระยะเวลา) -->
                    <div id="bucketTimeContainer" class="bg-gray-50 p-3 rounded-lg border">
                        <label class="block text-sm font-medium text-gray-700 mb-1">5. ระยะเวลาที่คาดหวัง</label>
                        <div class="flex space-x-2">
                            <input type="number" id="timeNumber" min="1" value="1" class="w-1/2 rounded-md border p-2 text-sm focus:border-indigo-500">
                            <select id="timeUnit" class="w-1/2 rounded-md border p-2 text-sm focus:border-indigo-500">
                                <option value="weeks">สัปดาห์</option>
                                <option value="months">เดือน</option>
                                <option value="years">ปี</option>
                            </select>
                        </div>
                        <label class="flex items-center space-x-2 text-sm text-gray-600 mt-3 cursor-pointer">
                            <input type="checkbox" id="itemTBD" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                            <span class="font-medium text-orange-600">ยังไม่มีกำหนด (TBD)</span>
                        </label>
                    </div>

                    <!-- โซน To-Do List (วันที่และเวลาชัดเจน) ซ่อนไว้ก่อน -->
                    <div id="todoTimeContainer" class="bg-green-50 p-3 rounded-lg border border-green-100 hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-1">5. กำหนดเวลาที่แน่นอน (To-Do)</label>
                        <input type="date" id="todoDate" class="mt-1 block w-full rounded-md border p-2 text-sm focus:border-green-500 mb-2">
                        <div class="flex items-center gap-2">
                            <div class="w-1/2">
                                <label class="block text-[11px] text-gray-500 font-bold">เวลาเริ่ม</label>
                                <input type="time" id="todoStartTime" class="mt-1 block w-full rounded-md border p-2 text-sm focus:border-green-500">
                            </div>
                            <span class="mt-4">-</span>
                            <div class="w-1/2">
                                <label class="block text-[11px] text-gray-500 font-bold">เวลาเสร็จ</label>
                                <input type="time" id="todoEndTime" class="mt-1 block w-full rounded-md border p-2 text-sm focus:border-green-500">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">6. ความเป็นไปได้ / ความยาก</label>
                        <select id="itemPossibility" class="mt-1 block w-full rounded-md border p-2 text-sm">
                            <option value="3">🟢 เป็นไปได้สูง / ง่ายมาก</option>
                            <option value="2">🟡 ปานกลาง / ต้องพยายาม</option>
                            <option value="1">🔴 ยากมาก / โอกาสน้อย</option>
                        </select>
                    </div>

                    <div class="pt-3">
                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-indigo-700" id="submitBtn">
                            บันทึกข้อมูล
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- โหลด Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🛑 วาง CONFIG FIREBASE ของคุณตรงนี้
        const firebaseConfig = {
            apiKey: "AIzaSyBRw1lZxzzZSZ5jCSYOGuQ0W3XF_nG0FcU",
            authDomain: "bucketlist-b78bb.firebaseapp.com",
            projectId: "bucketlist-b78bb",
            storageBucket: "bucketlist-b78bb.firebasestorage.app",
            messagingSenderId: "130123297398",
            measurementId: "G-0KMEHK4MKQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "bucketlist");

        // 🛑 ลิงก์ API GAS
        const GAS_CALENDAR_URL = "https://script.google.com/macros/s/AKfycbzwuQltKiLAoCHfDE86csfw9lSAT3Wz5VIGEO-CH3Kop5_h9nWePkE8rW0F353VL3vE/exec";

        let allItems = [];
        const unitLabels = { "weeks": "สัปดาห์", "months": "เดือน", "years": "ปี" };

        // ------------------ UI Event Listeners ------------------
        
        // สลับโหมดการกรอก Bucket vs To-do
        document.querySelectorAll('input[name="itemType"]').forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'todo') {
                    document.getElementById('bucketTimeContainer').classList.add('hidden');
                    document.getElementById('todoTimeContainer').classList.remove('hidden');
                } else {
                    document.getElementById('bucketTimeContainer').classList.remove('hidden');
                    document.getElementById('todoTimeContainer').classList.add('hidden');
                }
            });
        });

        document.getElementById('itemTBD').addEventListener('change', function() {
            const isChecked = this.checked;
            document.getElementById('timeNumber').disabled = isChecked;
            document.getElementById('timeUnit').disabled = isChecked;
        });

        // ------------------ Core Logic ------------------
        
        function calculateDaysLeft(createdAt, calculatedDays, isTBD, specificDate, itemType) {
            if (itemType === 'todo') {
                if(!specificDate) return Infinity;
                const diffTime = new Date(specificDate) - new Date();
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            } else {
                if (isTBD) return Infinity;
                const diffTime = new Date(new Date(createdAt).getTime() + (calculatedDays * 24 * 60 * 60 * 1000)) - new Date();
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            }
        }

        async function loadItemsFromDB() {
            try {
                const querySnapshot = await getDocs(colRef);
                allItems = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    data.daysLeft = calculateDaysLeft(data.createdAt, data.calculatedDays, data.isTBD, data.specificDate, data.itemType);
                    allItems.push({ id: docSnap.id, ...data });
                });
                renderItems();
            } catch (error) {
                console.error(error);
                document.getElementById('bucketListContainer').innerHTML = '<div class="col-span-full text-center text-red-500 py-10">เชื่อมต่อฐานข้อมูลล้มเหลว</div>';
            }
        }

        window.renderItems = function() {
            const container = document.getElementById('bucketListContainer');
            const statusFilter = document.getElementById('filterStatus').value;
            const typeFilter = document.getElementById('filterType').value;

            let filteredItems = allItems.filter(item => {
                const matchStatus = statusFilter === 'all' || 
                                   (statusFilter === 'completed' && item.isCompleted) || 
                                   (statusFilter === 'pending' && !item.isCompleted);
                const matchType = typeFilter === 'all' || item.itemType === typeFilter;
                return matchStatus && matchType;
            });

            filteredItems.sort((a, b) => {
                // เอางาน To-Do ที่ระบุวันเวลาชัดเจนขึ้นก่อน
                const daysA = a.isTBD ? Infinity : a.daysLeft;
                const daysB = b.isTBD ? Infinity : b.daysLeft;
                return daysA - daysB; 
            });

            document.getElementById('statTotal').innerText = allItems.length;
            document.getElementById('statCompleted').innerText = allItems.filter(i => i.isCompleted).length;
            document.getElementById('statBudget').innerText = allItems.filter(i => !i.isCompleted).reduce((sum, item) => sum + Number(item.price), 0).toLocaleString();

            container.innerHTML = '';
            if(filteredItems.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 bg-white rounded-xl shadow-sm">ไม่พบข้อมูลในหมวดหมู่นี้</div>';
                return;
            }

            filteredItems.forEach((item) => {
                const isDone = item.isCompleted;

                // Badge เตือนเวลา
                let badgeHtml = '';
                if (!item.isTBD && !isDone) {
                    if (item.daysLeft < 0) badgeHtml = `<span class="bg-red-100 text-red-700 text-[10px] px-2 py-1 rounded-full font-bold shadow-sm">🚨 เลยกำหนด</span>`;
                    else if (item.daysLeft === 0) badgeHtml = `<span class="bg-orange-100 text-orange-700 text-[10px] px-2 py-1 rounded-full font-bold shadow-sm">⏰ วันนี้!</span>`;
                    else badgeHtml = `<span class="bg-blue-50 text-blue-600 text-[10px] px-2 py-1 rounded-full font-medium">เหลือ ${item.daysLeft} วัน</span>`;
                } else if (isDone) {
                    badgeHtml = `<span class="bg-green-100 text-green-700 text-[10px] px-2 py-1 rounded-full font-bold">✅ สำเร็จแล้ว</span>`;
                }

                // รูปแบบป้ายระบุประเภท
                const typeLabel = item.itemType === 'todo' ? '✅ To-Do List' : '🌟 Bucket List';
                
                // รูปแบบข้อความระบุเวลา
                let timeDisplay = '';
                if (item.itemType === 'todo') {
                    const dateObj = new Date(item.specificDate);
                    timeDisplay = `${dateObj.toLocaleDateString('th-TH')} | 🕒 ${item.startTime} - ${item.endTime}`;
                } else {
                    timeDisplay = item.isTBD ? "รอเหตุการณ์ (TBD)" : `ภายใน ${item.timeNumber} ${unitLabels[item.timeUnit]}`;
                }

                const card = `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition p-5 border-l-4 ${isDone ? 'border-gray-400 completed-item' : (item.itemType === 'todo' ? 'border-green-400' : 'border-indigo-400')} relative flex flex-col h-full">
                        
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-lg font-bold ${isDone ? 'line-through text-gray-500' : 'text-gray-800'} pr-2 leading-tight">${item.name}</h3>
                            <div class="flex flex-col items-end gap-1">
                                <span class="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-1 rounded-full">${typeLabel}</span>
                                ${badgeHtml}
                            </div>
                        </div>
                        
                        <div class="text-sm text-gray-600 space-y-1 mb-2 flex-grow">
                            <p class="text-[12px] font-medium text-gray-500">📅 กำหนด: <span class="${item.itemType === 'todo' ? 'text-green-600' : 'text-indigo-600'}">${timeDisplay}</span></p>
                            <p class="mt-1">💰 งบประมาณ: <span class="font-medium text-green-600">฿${Number(item.price).toLocaleString()}</span></p>
                        </div>
                        
                        <div class="mt-auto border-t pt-3 mt-4 flex justify-between items-center">
                            <button onclick="deleteItem('${item.id}')" class="text-xs text-red-400 hover:text-red-600 font-medium">ลบทิ้ง</button>
                            <button onclick="toggleStatus('${item.id}', ${isDone})" class="text-xs px-3 py-1.5 rounded-full font-bold transition ${isDone ? 'bg-gray-200 text-gray-600' : 'bg-green-100 text-green-700 hover:bg-green-200'}">
                                ${isDone ? 'ยกเลิกสถานะ' : '✅ เสร็จแล้ว!'}
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        };

        window.openAddModal = function() {
            document.getElementById('bucketForm').reset();
            document.getElementById('editId').value = ""; 
            
            // รีเซ็ตให้กลับไปหน้า Bucket List เป็นค่าเริ่มต้น
            document.querySelector('input[name="itemType"][value="bucket"]').checked = true;
            document.getElementById('bucketTimeContainer').classList.remove('hidden');
            document.getElementById('todoTimeContainer').classList.add('hidden');
            
            toggleModal('mainModal');
        }

        // ==========================================
        // การบันทึกเข้า Firebase + ยิงเข้า Calendar
        // ==========================================
        document.getElementById('bucketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'กำลังบันทึก...'; btn.disabled = true;

            const editId = document.getElementById('editId').value;
            const itemType = document.querySelector('input[name="itemType"]:checked').value;
            
            const isTBD = document.getElementById('itemTBD').checked;
            const tNumber = Number(document.getElementById('timeNumber').value);
            const tUnit = document.getElementById('timeUnit').value;
            const specificDate = document.getElementById('todoDate').value;
            const startTime = document.getElementById('todoStartTime').value;
            const endTime = document.getElementById('todoEndTime').value;
            
            let calculatedDays = 0;
            if(itemType === 'bucket' && !isTBD) {
                if(tUnit === 'weeks') calculatedDays = tNumber * 7;
                else if(tUnit === 'months') calculatedDays = tNumber * 30;
                else if(tUnit === 'years') calculatedDays = tNumber * 365;
            }

            let exactTargetDate = null;
            if (itemType === 'bucket' && !isTBD) {
                exactTargetDate = new Date(new Date().getTime() + (calculatedDays * 24 * 60 * 60 * 1000)).toISOString();
            }

            const data = {
                name: document.getElementById('itemName').value,
                price: Number(document.getElementById('itemPrice').value),
                necessity: Number(document.getElementById('itemNecessity').value),
                impact: Number(document.getElementById('itemImpact').value),
                possibility: Number(document.getElementById('itemPossibility').value),
                itemType: itemType, // 'bucket' or 'todo'
                
                // สำหรับ Bucket List
                timeNumber: tNumber,
                timeUnit: tUnit,
                isTBD: isTBD,
                calculatedDays: calculatedDays,
                
                // สำหรับ To-Do List
                specificDate: specificDate,
                startTime: startTime,
                endTime: endTime
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "bucketlist", editId), data);
                } else {
                    data.isCompleted = false;
                    data.createdAt = new Date().toISOString();
                    await addDoc(colRef, data);

                    // 🔥 ยิง API ปัก Calendar โดยแยกว่าเป็น Todo หรือ Bucket
                    if ((itemType === 'todo' && specificDate && startTime) || (itemType === 'bucket' && !isTBD)) {
                        fetch(GAS_CALENDAR_URL, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify({
                                name: data.name,
                                price: data.price,
                                necessity: data.necessity,
                                itemType: data.itemType,
                                isTBD: data.isTBD,
                                targetDate: exactTargetDate, // ใช้ของ Bucket
                                specificDate: data.specificDate, // ใช้ของ Todo
                                startTime: data.startTime,
                                endTime: data.endTime
                            })
                        }).then(r => console.log("ส่งเข้า Calendar สำเร็จ"));
                    }
                }
                
                toggleModal('mainModal');
                loadItemsFromDB(); 
            } catch (error) {
                alert("บันทึกไม่สำเร็จ");
            } finally {
                btn.innerHTML = 'บันทึกข้อมูล'; btn.disabled = false;
            }
        });

        window.deleteItem = async function(id) {
            if(confirm("ลบรายการนี้ใช่ไหม?")) {
                await deleteDoc(doc(db, "bucketlist", id));
                loadItemsFromDB();
            }
        };

        window.toggleStatus = async function(id, currentStatus) {
            await updateDoc(doc(db, "bucketlist", id), { isCompleted: !currentStatus });
            loadItemsFromDB(); 
        };

        loadItemsFromDB();
    </script>

    <script>
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        }
    </script>
</body>
</html>
