<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Bucket List</title>
    <!-- โหลด Tailwind CSS เพื่อความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: hidden !important; }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <!-- Header & Dashboard -->
    <div class="max-w-4xl mx-auto p-6 mt-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-indigo-600">🎯 My Bucket List</h1>
                <p class="text-gray-500 mt-1">จัดอันดับสิ่งที่อยากทำด้วยระบบให้คะแนนอัตโนมัติ</p>
            </div>
            <button onclick="toggleModal('addModal')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition transform hover:scale-105">
                + เพิ่มรายการใหม่
            </button>
        </div>

        <!-- พื้นที่แสดง Bucket List -->
        <div id="bucketListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- ข้อมูลจะถูกโหลดมาใส่ตรงนี้ด้วย JavaScript -->
            <div class="col-span-full text-center py-10 text-gray-400" id="loadingText">
                กำลังโหลดข้อมูล...
            </div>
        </div>
    </div>

    <!-- Modal สำหรับเพิ่มข้อมูล -->
    <div class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50" id="addModal">
        <div class="modal-overlay absolute w-full h-full bg-black opacity-50" onclick="toggleModal('addModal')"></div>
        
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-xl shadow-2xl z-50 overflow-y-auto">
            <div class="modal-content py-6 text-left px-6">
                <!-- Title -->
                <div class="flex justify-between items-center pb-3">
                    <p class="text-2xl font-bold">✨ เพิ่มเป้าหมายใหม่</p>
                    <div class="modal-close cursor-pointer z-50" onclick="toggleModal('addModal')">
                        <svg class="fill-current text-gray-500 hover:text-red-500" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
                            <path d="M14.53 4.53l-1.06-1.06L9 7.94 4.53 3.47 3.47 4.53 7.94 9l-4.47 4.47 1.06 1.06L9 10.06l4.47 4.47 1.06-1.06L10.06 9z"></path>
                        </svg>
                    </div>
                </div>

                <!-- Form -->
                <form id="bucketForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">1. สิ่งที่อยากทำ</label>
                        <input type="text" id="itemName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-indigo-500 focus:ring-indigo-500" placeholder="เช่น ไปดูคอนเสิร์ต Oasis">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">2. ราคาที่ประเมินไว้ (บาท)</label>
                        <input type="number" id="itemPrice" required min="0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="0 = ฟรี">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">3. ความจำเป็น</label>
                        <select id="itemNecessity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="3">🔥 ต้องทำให้ได้ (Must have)</option>
                            <option value="2">⭐ ควรทำ (Should have)</option>
                            <option value="1">☁️ แค่ความอยาก (Nice to have)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">4. ผลกระทบหากไม่มี/ไม่ได้ทำ</label>
                        <select id="itemImpact" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="3">😭 เสียใจ/เสียดายมาก</option>
                            <option value="2">🥲 เสียดายปานกลาง</option>
                            <option value="1">😌 ไม่เป็นไร</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">5. กำหนดที่คิดจะวางไว้</label>
                        <input type="date" id="itemDate" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 mb-2">
                        <label class="flex items-center space-x-2 text-sm text-gray-600">
                            <input type="checkbox" id="itemTBD" class="rounded text-indigo-600 focus:ring-indigo-500">
                            <span>ยังไม่มีกำหนด (TBD / รอเหตุการณ์ในอนาคต)</span>
                        </label>
                    </div>

                    <div class="flex justify-end pt-4">
                        <button type="submit" class="px-6 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 w-full" id="submitBtn">
                            บันทึกเป้าหมาย
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- โหลด Firebase Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🛑 🛑 🛑 เอา FIREBASE CONFIG ของคุณมาวางตรงนี้ 🛑 🛑 🛑
        const firebaseConfig = {
            apiKey: "AIzaSyBRw1lZxzzZSZ5jCSYOGuQ0W3XF_nG0FcU",
            authDomain: "bucketlist-b78bb.firebaseapp.com",
            projectId: "bucketlist-b78bb",
            storageBucket: "bucketlist-b78bb.firebasestorage.app",
            messagingSenderId: "130123297398",
            appId: "1:130123297398:web:6ec6af77741e1dc770e557",
            measurementId: "G-0KMEHK4MKQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "bucketlist");

        // จัดการ Checkbox TBD (ถ้าติ๊ก ให้ช่องเลือกวันที่กรอกไม่ได้)
        document.getElementById('itemTBD').addEventListener('change', function() {
            document.getElementById('itemDate').disabled = this.checked;
            if(this.checked) document.getElementById('itemDate').value = "";
        });

        // ฟังก์ชันคำนวณคะแนนระยะเวลา
        function getUrgencyScore(dateStr, isTBD) {
            if (isTBD || !dateStr) return 0;
            const targetDate = new Date(dateStr);
            const today = new Date();
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays <= 90) return 3; // ด่วน (ภายใน 3 เดือน)
            if (diffDays <= 180) return 2; // ระยะกลาง (3-6 เดือน)
            return 1; // ระยะยาว (มากกว่า 6 เดือน)
        }

        // ฟังก์ชันดึงและคำนวณข้อมูล
        async function loadItems() {
            const container = document.getElementById('bucketListContainer');
            try {
                const querySnapshot = await getDocs(colRef);
                let items = [];
                
                querySnapshot.forEach((doc) => {
                    items.push({ id: doc.id, ...doc.data() });
                });

                // 🧠 ระบบเรียงลำดับ (Sorting Logic)
                items.sort((a, b) => {
                    const urgencyA = getUrgencyScore(a.targetDate, a.isTBD);
                    const urgencyB = getUrgencyScore(b.targetDate, b.isTBD);

                    const scoreA = (Number(a.necessity) * 2) + (Number(a.impact) * 2) + urgencyA;
                    const scoreB = (Number(b.necessity) * 2) + (Number(b.impact) * 2) + urgencyB;

                    // 1. เรียงตามคะแนนรวม
                    if (scoreA !== scoreB) return scoreB - scoreA;
                    
                    // 2. ราคา (น้อยกว่าขึ้นก่อน)
                    if (a.price !== b.price) return a.price - b.price;

                    // 3. วันที่
                    const hasDateA = !a.isTBD && a.targetDate;
                    const hasDateB = !b.isTBD && b.targetDate;

                    if (hasDateA && hasDateB) {
                        return new Date(a.targetDate) - new Date(b.targetDate);
                    } else if (hasDateA && !hasDateB) {
                        return -1;
                    } else if (!hasDateA && hasDateB) {
                        return 1;
                    } else {
                        return 0;
                    }
                });

                // วาด UI
                container.innerHTML = '';
                if(items.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">ยังไม่มีเป้าหมายเลย กดปุ่ม + เพื่อเพิ่มได้เลย!</div>';
                    return;
                }

                items.forEach((item, index) => {
                    const score = (Number(item.necessity) * 2) + (Number(item.impact) * 2) + getUrgencyScore(item.targetDate, item.isTBD);
                    const dateDisplay = item.isTBD ? "⏳ รอเหตุการณ์ (TBD)" : new Date(item.targetDate).toLocaleDateString('th-TH', {year: 'numeric', month: 'short', day: 'numeric'});
                    
                    const card = `
                        <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition p-5 border-l-4 ${index === 0 ? 'border-yellow-400' : 'border-indigo-400'} relative">
                            ${index === 0 ? '<span class="absolute -top-3 -right-3 text-2xl">👑</span>' : ''}
                            <div class="flex justify-between items-start">
                                <h3 class="text-lg font-bold text-gray-800">${item.name}</h3>
                                <span class="bg-gray-100 text-gray-600 text-xs font-bold px-2 py-1 rounded">Score: ${score}</span>
                            </div>
                            <p class="text-sm text-gray-500 mt-2"><i class="far fa-calendar-alt"></i> กำหนด: <span class="font-medium ${item.isTBD ? 'text-orange-500' : 'text-gray-700'}">${dateDisplay}</span></p>
                            <p class="text-sm text-gray-500 mt-1"><i class="fas fa-tag"></i> ประเมินราคา: <span class="font-medium text-green-600">฿${Number(item.price).toLocaleString()}</span></p>
                            
                            <div class="mt-4 flex gap-2">
                                <span class="text-[10px] px-2 py-1 bg-blue-50 text-blue-600 rounded-full border border-blue-200">จำเป็น: ระดับ ${item.necessity}</span>
                                <span class="text-[10px] px-2 py-1 bg-red-50 text-red-600 rounded-full border border-red-200">ผลกระทบ: ระดับ ${item.impact}</span>
                            </div>
                            
                            <button onclick="deleteItem('${item.id}')" class="mt-4 text-xs text-red-400 hover:text-red-600 underline">ลบรายการนี้</button>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                console.error("Error loading docs: ", error);
                container.innerHTML = '<div class="col-span-full text-center text-red-500 py-10">ไม่สามารถเชื่อมต่อฐานข้อมูลได้ (ลืมใส่ Keys หรือเปล่า?)</div>';
            }
        }

        // ฟังก์ชันบันทึกข้อมูล
        document.getElementById('bucketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'กำลังบันทึก...';
            btn.disabled = true;

            const isTBD = document.getElementById('itemTBD').checked;
            
            const newData = {
                name: document.getElementById('itemName').value,
                price: Number(document.getElementById('itemPrice').value),
                necessity: Number(document.getElementById('itemNecessity').value),
                impact: Number(document.getElementById('itemImpact').value),
                targetDate: isTBD ? null : document.getElementById('itemDate').value,
                isTBD: isTBD,
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(colRef, newData);
                document.getElementById('bucketForm').reset();
                toggleModal('addModal');
                loadItems(); // โหลดใหม่
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("เกิดข้อผิดพลาดในการบันทึก");
            } finally {
                btn.innerHTML = 'บันทึกเป้าหมาย';
                btn.disabled = false;
            }
        });

        // ทำให้ฟังก์ชันลบเรียกใช้จาก HTML ได้
        window.deleteItem = async function(id) {
            if(confirm("แน่ใจหรือไม่ว่าต้องการลบรายการนี้?")) {
                await deleteDoc(doc(db, "bucketlist", id));
                loadItems();
            }
        }

        // โหลดข้อมูลครั้งแรกเมื่อเปิดหน้าเว็บ
        loadItems();
    </script>

    <!-- Script สำหรับเปิด/ปิด Modal -->
    <script>
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        }
    </script>
</body>
</html>
