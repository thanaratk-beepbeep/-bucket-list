<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Smart Bucket List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: hidden !important; }
        .completed-item { opacity: 0.6; filter: grayscale(100%); }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <!-- Header & Dashboard -->
    <div class="max-w-4xl mx-auto p-4 md:p-6 mt-4 md:mt-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-indigo-600">🎯 My Bucket List</h1>
                <p class="text-gray-500 mt-1">จัดอันดับและติดตามสิ่งที่อยากทำ</p>
            </div>
            <!-- เปลี่ยนปุ่มให้ไปเรียก openAddModal() แทน -->
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition transform hover:scale-105 w-full md:w-auto">
                + เพิ่มรายการใหม่
            </button>
        </div>

        <!-- 📊 Statistics Section -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-4 text-center border-b-4 border-indigo-400">
                <p class="text-xs md:text-sm text-gray-500 font-semibold">เป้าหมายทั้งหมด</p>
                <p class="text-2xl md:text-3xl font-bold text-gray-800" id="statTotal">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 text-center border-b-4 border-green-400">
                <p class="text-xs md:text-sm text-gray-500 font-semibold">งบที่ต้องใช้ (฿)</p>
                <p class="text-xl md:text-2xl font-bold text-green-600" id="statBudget">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm p-4 text-center border-b-4 border-yellow-400">
                <p class="text-xs md:text-sm text-gray-500 font-semibold">สำเร็จแล้ว</p>
                <p class="text-2xl md:text-3xl font-bold text-yellow-600" id="statCompleted">0</p>
            </div>
        </div>

        <!-- 🔍 Filters Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-4">
            <div class="flex-1">
                <label class="block text-xs font-medium text-gray-500 mb-1">สถานะ</label>
                <select id="filterStatus" onchange="renderItems()" class="w-full rounded-md border-gray-300 shadow-sm border p-2 text-sm focus:border-indigo-500">
                    <option value="all">แสดงทั้งหมด</option>
                    <option value="pending" selected>⏳ รอทำ (ยังไม่สำเร็จ)</option>
                    <option value="completed">✅ สำเร็จแล้ว</option>
                </select>
            </div>
            <div class="flex-1">
                <label class="block text-xs font-medium text-gray-500 mb-1">ช่วงเวลาที่เหลือ</label>
                <select id="filterTimeframe" onchange="renderItems()" class="w-full rounded-md border-gray-300 shadow-sm border p-2 text-sm focus:border-indigo-500">
                    <option value="all">ทุกช่วงเวลา</option>
                    <option value="urgent">⏰ โค้งสุดท้าย / เลยกำหนด (< 14 วัน)</option>
                    <option value="short">ระยะสั้น (เหลือ < 3 เดือน)</option>
                    <option value="medium">ระยะกลาง (เหลือ < 1 ปี)</option>
                    <option value="long">ระยะยาว (เหลือ > 1 ปี)</option>
                    <option value="tbd">รอเหตุการณ์ (TBD)</option>
                </select>
            </div>
        </div>

        <!-- 📝 พื้นที่แสดง Bucket List -->
        <div id="bucketListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full text-center py-10 text-gray-400" id="loadingText">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <!-- 🛠 Modal สำหรับเพิ่ม/แก้ไขข้อมูล -->
    <div class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50 px-4" id="mainModal">
        <div class="modal-overlay absolute w-full h-full bg-black opacity-50" onclick="toggleModal('mainModal')"></div>
        <div class="modal-container bg-white w-full max-w-md mx-auto rounded-xl shadow-2xl z-50 overflow-y-auto max-h-[90vh]">
            <div class="modal-content py-4 px-6 text-left">
                <div class="flex justify-between items-center pb-3 border-b">
                    <!-- ให้ ID กับ Title เพื่อเปลี่ยนข้อความได้ -->
                    <p class="text-xl font-bold text-gray-800" id="modalTitle">✨ เพิ่มเป้าหมายใหม่</p>
                    <div class="modal-close cursor-pointer z-50" onclick="toggleModal('mainModal')">
                        <span class="text-2xl text-gray-400 hover:text-red-500">&times;</span>
                    </div>
                </div>
                
                <form id="bucketForm" class="space-y-3 mt-4">
                    <!-- 🛑 ซ่อน Input สำหรับเก็บ ID ตอนกดแก้ไข -->
                    <input type="hidden" id="editId" value="">

                    <div>
                        <label class="block text-sm font-medium text-gray-700">1. สิ่งที่อยากทำ</label>
                        <input type="text" id="itemName" required class="mt-1 block w-full rounded-md border p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">2. ราคา/งบประมาณ (บาท)</label>
                        <input type="number" id="itemPrice" required min="0" class="mt-1 block w-full rounded-md border p-2 text-sm" placeholder="0 = ฟรี">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">3. ความจำเป็น</label>
                        <select id="itemNecessity" class="mt-1 block w-full rounded-md border p-2 text-sm">
                            <option value="3">🔥 ต้องทำให้ได้ (Must have)</option>
                            <option value="2">⭐ ควรทำ (Should have)</option>
                            <option value="1">☁️ แค่ความอยาก (Nice to have)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">4. ผลกระทบหากไม่ได้ทำ</label>
                        <select id="itemImpact" class="mt-1 block w-full rounded-md border p-2 text-sm">
                            <option value="3">😭 เสียดายมาก / กระทบหนัก</option>
                            <option value="2">🥲 เสียดายปานกลาง</option>
                            <option value="1">😌 ไม่เป็นไร</option>
                        </select>
                    </div>
                    
                    <div class="bg-gray-50 p-3 rounded-lg border">
                        <label class="block text-sm font-medium text-gray-700 mb-1">5. ระยะเวลาที่คาดหวัง</label>
                        <div class="flex space-x-2">
                            <input type="number" id="timeNumber" min="1" value="1" class="w-1/2 rounded-md border p-2 text-sm focus:border-indigo-500" placeholder="ระบุตัวเลข">
                            <select id="timeUnit" class="w-1/2 rounded-md border p-2 text-sm focus:border-indigo-500">
                                <option value="weeks">สัปดาห์</option>
                                <option value="months">เดือน</option>
                                <option value="years">ปี</option>
                            </select>
                        </div>
                        <label class="flex items-center space-x-2 text-sm text-gray-600 mt-3 cursor-pointer">
                            <input type="checkbox" id="itemTBD" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                            <span class="font-medium text-orange-600">ยังไม่มีกำหนด (TBD / รอเหตุการณ์)</span>
                        </label>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">6. ความเป็นไปได้ / ความยาก</label>
                        <select id="itemPossibility" class="mt-1 block w-full rounded-md border p-2 text-sm">
                            <option value="3">🟢 เป็นไปได้สูง / ง่ายมาก</option>
                            <option value="2">🟡 ปานกลาง / ต้องพยายาม</option>
                            <option value="1">🔴 ยากมาก / โอกาสน้อย</option>
                        </select>
                    </div>
                    <div class="pt-3">
                        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-indigo-700" id="submitBtn">
                            บันทึกเป้าหมาย
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🛑 🛑 วาง CONFIG ของคุณตรงนี้ 🛑 🛑
        const firebaseConfig = {
            apiKey: "AIzaSyBRw1lZxzzZSZ5jCSYOGuQ0W3XF_nG0FcU",
            authDomain: "bucketlist-b78bb.firebaseapp.com",
            projectId: "bucketlist-b78bb",
            storageBucket: "bucketlist-b78bb.firebasestorage.app",
            messagingSenderId: "130123297398",
            appId: "1:130123297398:web:6ec6af77741e1dc770e557",
            measurementId: "G-0KMEHK4MKQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "bucketlist");

        let allItems = [];
        const unitLabels = { "weeks": "สัปดาห์", "months": "เดือน", "years": "ปี" };

        document.getElementById('itemTBD').addEventListener('change', function() {
            const isChecked = this.checked;
            document.getElementById('timeNumber').disabled = isChecked;
            document.getElementById('timeUnit').disabled = isChecked;
            if(isChecked) {
                document.getElementById('timeNumber').classList.add('bg-gray-200');
                document.getElementById('timeUnit').classList.add('bg-gray-200');
            } else {
                document.getElementById('timeNumber').classList.remove('bg-gray-200');
                document.getElementById('timeUnit').classList.remove('bg-gray-200');
            }
        });

        // ⏳ คำนวณวันเหลือแบบ Real-time
        function calculateDaysLeft(createdAt, calculatedDays, isTBD) {
            if (isTBD) return Infinity;
            const createdDate = new Date(createdAt);
            const deadlineDate = new Date(createdDate.getTime() + (calculatedDays * 24 * 60 * 60 * 1000));
            const today = new Date();
            const diffTime = deadlineDate - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        async function loadItemsFromDB() {
            try {
                const querySnapshot = await getDocs(colRef);
                allItems = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    data.daysLeft = calculateDaysLeft(data.createdAt, data.calculatedDays, data.isTBD);
                    allItems.push({ id: doc.id, ...data });
                });
                renderItems();
            } catch (error) {
                console.error("Error loading docs:", error);
                document.getElementById('bucketListContainer').innerHTML = '<div class="col-span-full text-center text-red-500 py-10">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</div>';
            }
        }

        function getUrgencyScore(isTBD, daysLeft) {
            if(isTBD) return 0;
            if(daysLeft <= 14) return 5;
            if(daysLeft <= 30) return 4;
            if(daysLeft <= 90) return 3;
            if(daysLeft <= 365) return 2;
            return 1;
        }

        function sortItems(items) {
            return items.sort((a, b) => {
                const urgencyA = getUrgencyScore(a.isTBD, a.daysLeft);
                const urgencyB = getUrgencyScore(b.isTBD, b.daysLeft);
                const scoreA = (Number(a.necessity) * 2) + (Number(a.impact) * 2) + urgencyA + Number(a.possibility);
                const scoreB = (Number(b.necessity) * 2) + (Number(b.impact) * 2) + urgencyB + Number(b.possibility);

                if (scoreA !== scoreB) return scoreB - scoreA;
                if (a.price !== b.price) return Number(a.price) - Number(b.price);
                const daysA = a.isTBD ? Infinity : a.daysLeft;
                const daysB = b.isTBD ? Infinity : b.daysLeft;
                return daysA - daysB; 
            });
        }

        window.renderItems = function() {
            const container = document.getElementById('bucketListContainer');
            const statusFilter = document.getElementById('filterStatus').value;
            const timeFilter = document.getElementById('filterTimeframe').value;

            let filteredItems = allItems.filter(item => {
                const matchStatus = statusFilter === 'all' || 
                                   (statusFilter === 'completed' && item.isCompleted) || 
                                   (statusFilter === 'pending' && !item.isCompleted);
                
                let matchTime = true;
                if(timeFilter === 'urgent') matchTime = !item.isTBD && item.daysLeft <= 14;
                else if(timeFilter === 'short') matchTime = !item.isTBD && item.daysLeft <= 90;
                else if(timeFilter === 'medium') matchTime = !item.isTBD && item.daysLeft > 90 && item.daysLeft <= 365;
                else if(timeFilter === 'long') matchTime = !item.isTBD && item.daysLeft > 365;
                else if(timeFilter === 'tbd') matchTime = item.isTBD === true;
                
                return matchStatus && matchTime;
            });

            filteredItems = sortItems(filteredItems);

            document.getElementById('statTotal').innerText = allItems.length;
            document.getElementById('statCompleted').innerText = allItems.filter(i => i.isCompleted).length;
            document.getElementById('statBudget').innerText = allItems.filter(i => !i.isCompleted).reduce((sum, item) => sum + Number(item.price), 0).toLocaleString();

            container.innerHTML = '';
            if(filteredItems.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500 bg-white rounded-xl shadow-sm">ไม่พบเป้าหมายในหมวดหมู่นี้</div>';
                return;
            }

            filteredItems.forEach((item, index) => {
                const urgency = getUrgencyScore(item.isTBD, item.daysLeft);
                const score = (Number(item.necessity) * 2) + (Number(item.impact) * 2) + urgency + Number(item.possibility);
                const isDone = item.isCompleted;

                let badgeHtml = '';
                if (!item.isTBD && !isDone) {
                    if (item.daysLeft < 0) {
                        badgeHtml = `<span class="bg-red-100 text-red-700 text-[10px] px-2 py-1 rounded-full font-bold shadow-sm animate-pulse">🚨 เลยกำหนด ${Math.abs(item.daysLeft)} วัน</span>`;
                    } else if (item.daysLeft <= 14) {
                        badgeHtml = `<span class="bg-orange-100 text-orange-700 text-[10px] px-2 py-1 rounded-full font-bold shadow-sm">⏰ เหลือ ${item.daysLeft} วัน</span>`;
                    } else {
                        badgeHtml = `<span class="bg-blue-50 text-blue-600 text-[10px] px-2 py-1 rounded-full font-medium border border-blue-100">📅 เหลือ ${item.daysLeft} วัน</span>`;
                    }
                } else if (isDone) {
                    badgeHtml = `<span class="bg-green-100 text-green-700 text-[10px] px-2 py-1 rounded-full font-bold">✅ สำเร็จแล้ว</span>`;
                } else {
                    badgeHtml = `<span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-1 rounded-full font-medium">⏳ รอเหตุการณ์</span>`;
                }

                const targetText = item.isTBD ? "ยังไม่มีกำหนด" : `ภายใน ${item.timeNumber} ${unitLabels[item.timeUnit]}`;

                const card = `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition p-5 border-l-4 ${isDone ? 'border-gray-400 completed-item' : (index === 0 && statusFilter === 'pending' ? 'border-yellow-400' : 'border-indigo-400')} relative flex flex-col h-full">
                        ${!isDone && index === 0 && statusFilter === 'pending' ? '<span class="absolute -top-3 -right-3 text-3xl">👑</span>' : ''}
                        
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="text-lg font-bold ${isDone ? 'line-through text-gray-500' : 'text-gray-800'} pr-2 leading-tight">${item.name}</h3>
                            <div class="flex flex-col items-end gap-1">
                                <span class="bg-gray-100 text-gray-600 text-[11px] font-bold px-2 py-1 rounded-full whitespace-nowrap">Score: ${score}</span>
                                ${badgeHtml}
                            </div>
                        </div>
                        
                        <div class="text-sm text-gray-600 space-y-1 mb-4 flex-grow">
                            <p class="text-[12px] text-gray-400">เป้าหมาย: ${targetText}</p>
                            <p class="mt-1">💰 งบประมาณ: <span class="font-medium text-green-600">฿${Number(item.price).toLocaleString()}</span></p>
                        </div>
                        
                        <!-- 🛠 เพิ่มปุ่ม "แก้ไข" เข้ามาตรงนี้ -->
                        <div class="mt-auto border-t pt-3 flex justify-between items-center">
                            <div class="flex gap-4">
                                <button onclick="openEditModal('${item.id}')" class="text-xs text-blue-500 hover:text-blue-700 font-medium flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg> แก้ไข
                                </button>
                                <button onclick="deleteItem('${item.id}')" class="text-xs text-red-400 hover:text-red-600 font-medium">ลบทิ้ง</button>
                            </div>
                            
                            <button onclick="toggleStatus('${item.id}', ${isDone})" class="text-xs px-3 py-1.5 rounded-full font-bold transition ${isDone ? 'bg-gray-200 text-gray-600 hover:bg-gray-300' : 'bg-green-100 text-green-700 hover:bg-green-200'}">
                                ${isDone ? 'ยกเลิกสถานะ' : '✅ ทำสำเร็จแล้ว!'}
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        };

        // ------------------ Actions ------------------

        // ฟังก์ชันเมื่อกดปุ่ม "+ เพิ่มรายการใหม่" (เคลียร์ฟอร์มให้ว่าง)
        window.openAddModal = function() {
            document.getElementById('bucketForm').reset();
            document.getElementById('editId').value = ""; // เคลียร์ ID
            document.getElementById('modalTitle').innerText = "✨ เพิ่มเป้าหมายใหม่";
            document.getElementById('itemTBD').dispatchEvent(new Event('change'));
            toggleModal('mainModal');
        }

        // ฟังก์ชันเมื่อกดปุ่ม "แก้ไข" (ดึงข้อมูลเก่ามาใส่ฟอร์ม)
        window.openEditModal = function(id) {
            const item = allItems.find(i => i.id === id);
            if(!item) return;

            document.getElementById('editId').value = item.id; // ซ่อน ID ไว้รู้ว่ากำลังแก้
            document.getElementById('modalTitle').innerText = "✏️ แก้ไขเป้าหมาย";

            document.getElementById('itemName').value = item.name;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemNecessity').value = item.necessity;
            document.getElementById('itemImpact').value = item.impact;
            document.getElementById('itemPossibility').value = item.possibility;
            
            document.getElementById('itemTBD').checked = item.isTBD;
            document.getElementById('timeNumber').value = item.timeNumber;
            document.getElementById('timeUnit').value = item.timeUnit;
            
            // สั่งให้อัปเดตสถานะช่องกรอกเวลา
            document.getElementById('itemTBD').dispatchEvent(new Event('change'));

            toggleModal('mainModal');
        }

        // ฟังก์ชันบันทึกข้อมูล (ใช้ร่วมกันทั้ง เพิ่มใหม่ และ แก้ไข)
        document.getElementById('bucketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'กำลังบันทึก...'; btn.disabled = true;

            const editId = document.getElementById('editId').value;
            const isTBD = document.getElementById('itemTBD').checked;
            const tNumber = Number(document.getElementById('timeNumber').value);
            const tUnit = document.getElementById('timeUnit').value;
            
            let calculatedDays = 0;
            if(!isTBD) {
                if(tUnit === 'weeks') calculatedDays = tNumber * 7;
                else if(tUnit === 'months') calculatedDays = tNumber * 30;
                else if(tUnit === 'years') calculatedDays = tNumber * 365;
            }

            const data = {
                name: document.getElementById('itemName').value,
                price: Number(document.getElementById('itemPrice').value),
                necessity: Number(document.getElementById('itemNecessity').value),
                impact: Number(document.getElementById('itemImpact').value),
                possibility: Number(document.getElementById('itemPossibility').value),
                timeNumber: tNumber,
                timeUnit: tUnit,
                isTBD: isTBD,
                calculatedDays: calculatedDays
            };

            try {
                if (editId) {
                    // โหมดแก้ไข: อัปเดตข้อมูลเดิม (ไม่แก้ createdAt)
                    await updateDoc(doc(db, "bucketlist", editId), data);
                } else {
                    // โหมดเพิ่มใหม่: ใส่ค่าตั้งต้นเพิ่มเติม
                    data.isCompleted = false;
                    data.createdAt = new Date().toISOString();
                    await addDoc(colRef, data);
                }
                
                toggleModal('mainModal');
                loadItemsFromDB(); 
            } catch (error) {
                console.error(error); alert("เกิดข้อผิดพลาดในการบันทึก");
            } finally {
                btn.innerHTML = 'บันทึกเป้าหมาย'; btn.disabled = false;
            }
        });

        window.deleteItem = async function(id) {
            if(confirm("ลบรายการนี้ใช่ไหม?")) {
                await deleteDoc(doc(db, "bucketlist", id));
                loadItemsFromDB();
            }
        };

        window.toggleStatus = async function(id, currentStatus) {
            try {
                await updateDoc(doc(db, "bucketlist", id), { isCompleted: !currentStatus });
                loadItemsFromDB(); 
            } catch (error) {
                console.error("Error updating status:", error);
            }
        };

        loadItemsFromDB();
    </script>

    <!-- UI Script -->
    <script>
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        }
    </script>
</body>
